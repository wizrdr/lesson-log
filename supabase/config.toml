project_id = "lesson-log"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public", "lesson_log"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "https://wizrdr.github.io/lesson-log/"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "oneshot"

[functions.ll-transcribe]
import_map = "./functions/deno.json"
verify_jwt = true

[functions.ll-extract]
import_map = "./functions/deno.json"
verify_jwt = false
